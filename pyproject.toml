[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataone"
version = "0.1.0"
description = "DataOne — E-commerce Sales Analytics Platform (batch + real-time lakehouse)"
requires-python = ">=3.10"

# Single source of truth for dependencies. requirements.txt / requirements-dev.txt
# just point here, and requirements*.lock are generated from it (see CONTRIBUTING.md).
dependencies = [
    # Must match the Spark 3.5.1 cluster image and the Iceberg spark-runtime-3.5 jar.
    "pyspark>=3.5.1,<3.6",
    # kafka-python: producers (ingestion/kafka_producers.py).
    # confluent-kafka: Marquez lineage consumer (utils/marquez_consumer.py).
    "kafka-python>=2.0.2",
    "confluent-kafka>=2.3.0",
    "psycopg2-binary>=2.9.9",
    "pymongo>=4.7.2",
    "faker>=25.2.0",
    "python-dotenv>=1.0.1",
    "structlog>=24.1.0",
    "prefect>=3.0",
    "requests>=2.31.0",
    "textblob>=0.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.1",
    "pytest-cov>=5.0.0",
    "black>=24.4.2",
    "ruff>=0.4.4",
    # Used by tests/test_alerting_rules.py to parse the provisioned Grafana alerting YAML.
    "pyyaml>=6.0.1",
]

# src layout: `pip install -e .` puts the dataone package on the path, so
# `python -m dataone....` works without manually exporting PYTHONPATH=src.
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# Line length is enforced by black; E501 only flags long strings/comments it
# cannot wrap.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# These set env vars (e.g. NO_PROXY) before importing prefect/psycopg2 on purpose.
"src/dataone/orchestration/*.py" = ["E402"]
"src/dataone/generators/reviews_generator.py" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "spark: needs a real local SparkSession (Java required) — see tests/conftest.py",
    "iceberg: needs a local SparkSession with a real Iceberg catalog (Java + network on first run to fetch the Iceberg jar) — see tests/conftest.py",
]
# Default run excludes both — neither is available in every dev environment,
# and the Iceberg one needs network. `make test-spark` / `make test-iceberg`
# or `pytest -m spark` / `pytest -m iceberg` override this explicitly.
addopts = "-m \"not spark and not iceberg\""
