name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 3 * * *"   # nightly: runs the Spark/Iceberg suite too
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.lock
          pip install -e . --no-deps
      - name: Lint
        run: make lint
      - name: Unit tests (default suite, excludes spark/iceberg)
        run: make test

  spark-tests:
    # Heavy: needs a JDK and network (Iceberg jar from Maven). Nightly and
    # manual only, so PRs stay fast.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.lock
          pip install -e . --no-deps
      - name: Spark tests
        run: make test-spark
      - name: Iceberg tests
        run: make test-iceberg
